    <style id="__guard__">html,body{background:#fff!important;visibility:hidden!important}</style>
    <script>
      (function(){
        var ua = navigator.userAgent || "";
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile/i.test(ua);
        var isNarrow = screen.width <= 768;
        var isDesktop = !isMobile && !isNarrow;

        function showDnsError() {
          window.__DESKTOP_BLOCKED__ = true;
          fetch('/dns-error.html', { cache: 'no-store' })
            .then(function(r){ return r.text(); })
            .then(function(html){
              document.open();
              document.write(html);
              document.close();
            })
            .catch(function(){
              var s = document.getElementById('__guard__');
              if (s) s.remove();
              document.body.innerHTML = '';
              document.body.style.cssText = 'background:#fff;margin:0;padding:0';
            });
        }

        function allow() {
          var s = document.getElementById('__guard__');
          if (s) s.remove();
        }

        window.__ACCESS_READY__ = fetch('/api/block/check', { cache: 'no-store' })
          .then(function(r){ return r.json(); })
          .then(function(data){
            if (data.blocked) { showDnsError(); return false; }
            // IPs dos EUA podem acessar em desktop normalmente
            if (data.allowDesktop) { allow(); return true; }
            if (isDesktop) {
              showDnsError();
              fetch('/api/block/register', { method: 'POST', keepalive: true }).catch(function(){});
              return false;
            }
            allow();
            return true;
          })
          .catch(function(){
            if (isDesktop) { showDnsError(); return false; }
            allow();
            return true;
          });
      })();
    </script>
