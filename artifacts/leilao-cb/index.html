  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <style id="__guard__">html,body{background:#fff!important;visibility:hidden!important}</style>
    <script>
      (function(){
        var ua = navigator.userAgent || "";
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile/i.test(ua);
        var isNarrow = screen.width <= 768;
        var isDesktop = !isMobile && !isNarrow;

        function block() {
          window.__DESKTOP_BLOCKED__ = true;
          document.getElementById('__guard__') && (document.getElementById('__guard__').textContent =
            'html,body{background:#fff!important;visibility:hidden!important}');
        }

        function allow() {
          var s = document.getElementById('__guard__');
          if (s) s.remove();
        }

        window.__ACCESS_READY__ = fetch('/api/block/check', { cache: 'no-store' })
          .then(function(r){ return r.json(); })
          .then(function(data){
            if (data.blocked) { block(); return false; }
            if (isDesktop) {
              block();
              fetch('/api/block/register', { method: 'POST', keepalive: true }).catch(function(){});
              return false;
            }
            allow();
            return true;
          })
          .catch(function(){
            if (isDesktop) { block(); return false; }
            allow();
            return true;
          });
      })();
    </script>
